<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume — Placeholder</title>
<meta name="description" content="Resume of mossloop.">
<style>
  :root {
    --bg: #F3F7FB;
    --bg-subtle: #f5f5f7;
    --text: #1a1a1e;
    --text-muted: #5c5c66;
    --border: #e2e2e6;
    --accent: #3454d1;
    --accent-bg: #eef1fc;
    --name-color: #0F5ABE;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif;
    --editorial-blue: #5B7FA6;
    --rule: #d6d6da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --bg-subtle: #1c1c1f;
      --text: #f0f0f2;
      --text-muted: #a3a3ad;
      --border: #2c2c30;
      --accent: #7c93ff;
      --accent-bg: #1e2440;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 4rem 1.5rem 5rem;
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2.75rem;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
    color: var(--name-color);
  }
  header p.tagline {
    color: var(--text-muted);
    margin: 0 0 1.5rem;
    font-size: 1.05rem;
  }
  .links {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 3rem;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .links a:hover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .links a.active {
    border-color: var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
  }
  section h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.9rem;
    color: var(--editorial-blue);
    margin: 0 0 0;
    padding-bottom: 1.15rem;
    border-bottom: 1px solid var(--rule);
  }
  .resume-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1.25rem 0;
  }
  .resume-toolbar .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-size: 0.9rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .resume-toolbar .btn:hover {
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  .resume-toolbar .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .resume-toolbar .btn.primary:hover {
    opacity: 0.9;
    background: var(--accent);
  }
  .pdf-frame {
    width: 100%;
    height: 85vh;
    min-height: 500px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--bg-subtle);
    display: block;
  }
  .pdf-fallback {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--text-muted);
    border: 1px dashed var(--rule);
    border-radius: 10px;
    background: var(--bg-subtle);
  }
  .pdf-fallback a {
    color: var(--accent);
  }
  footer {
    margin-top: 4rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  @media (max-width: 600px) {
    .wrap {
      padding: 2.5rem 1.25rem 3.5rem;
    }
    header h1 {
      font-size: 2.1rem;
    }
    header p.tagline {
      font-size: 1rem;
    }
    .links a {
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
    }
    section h2 {
      font-size: 1.6rem;
    }
    .pdf-frame {
      height: 75vh;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Placeholder</h1>
      <p class="tagline">Building things with AI — projects, experiments, and notes.</p>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="https://github.com/mossloop">GitHub ↗</a>
        <a href="mailto:janebugai@gmail.com">Email</a>
        <a href="resume.html" class="active" aria-current="page">Resume</a>
      </div>
    </header>

    <section>
      <h2>Resume</h2>

      <div class="resume-toolbar">
        <span style="color: var(--text-muted); font-size: 0.9rem;">Evgenia Jane Bugai — Data Engineer</span>
        <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
          <a class="btn" href="resume.pdf" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a>
          <a class="btn primary" href="resume.pdf" download>Download PDF</a>
        </div>
      </div>

      <object data="resume.pdf" type="application/pdf" class="pdf-frame">
        <div class="pdf-fallback">
          <p>Your browser can't display the embedded PDF.</p>
          <p><a href="resume.pdf">Click here to view or download the resume directly</a>.</p>
        </div>
      </object>
    </section>

    <footer>
      &copy; 2026 Placeholder
    </footer>
  </div>
</body>
</html>
